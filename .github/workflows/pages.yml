name: Deploy LiquidGlassX website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build production site
        working-directory: website
        env:
          CI: true
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Validate Sileo repository metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f sileo-repo/dists/stable/Release
          test -f sileo-repo/dists/stable/main/binary-iphoneos-arm64/Packages
          test -f sileo-repo/dists/stable/main/binary-iphoneos-arm64/Packages.gz
          PKG=$(find sileo-repo/pool/main/com.blue.liquidglassx -type f -name '*.deb' | sort | tail -n 1)
          test -n "$PKG"
          grep -Fq "Package: com.blue.liquidglassx" sileo-repo/dists/stable/main/binary-iphoneos-arm64/Packages
          grep -Fq "Architecture: iphoneos-arm64" sileo-repo/dists/stable/main/binary-iphoneos-arm64/Packages
          grep -Fq "Filename: pool/main/com.blue.liquidglassx/$(basename "$PKG")" sileo-repo/dists/stable/main/binary-iphoneos-arm64/Packages
          EXPECTED_SHA=$(sha256sum "$PKG" | awk '{print $1}')
          grep -Fq "SHA256: $EXPECTED_SHA" sileo-repo/dists/stable/main/binary-iphoneos-arm64/Packages
          echo "Sileo repository metadata is consistent with $(basename "$PKG")"

      - name: Publish Sileo repository under GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/dist/sileo
          cp -a sileo-repo/. website/dist/sileo/
          echo "Published unsigned Sileo repository to the Pages artifact at /sileo/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Validate deployed Sileo source and package URL
        shell: bash
        env:
          SITE_URL: https://bluexdeev25432.github.io/LiquidGlassX
        run: |
          set -euo pipefail
          curl -fsSIL "$SITE_URL/sileo/index.html" | grep -Eq 'HTTP/.* 200|HTTP/.* 301|HTTP/.* 302'
          curl -fsSL "$SITE_URL/sileo/dists/stable/Release" | grep -Fq 'Suite: stable'
          curl -fsSL "$SITE_URL/sileo/dists/stable/main/binary-iphoneos-arm64/Packages" | grep -Fq 'Package: com.blue.liquidglassx'
          DEB_PATH=$(curl -fsSL "$SITE_URL/sileo/dists/stable/main/binary-iphoneos-arm64/Packages" | awk '$1=="Filename:" && $2 ~ /pool\/main\/com\.blue\.liquidglassx\// {print $2; exit}')
          test -n "$DEB_PATH"
          DEB_URL="$SITE_URL/sileo/$DEB_PATH"
          curl -fsSIL "$DEB_URL" | grep -Eq 'HTTP/.* 200|HTTP/.* 301|HTTP/.* 302'
          echo "Deployed Pages URL and unsigned Sileo metadata are responding successfully."
