name: Deploy LiquidGlassX website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build production site
        working-directory: website
        env:
          CI: true
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Validate Sileo repository metadata
        run: bash scripts/validate-sileo-repo.sh

      - name: Publish Sileo repository under GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/dist/sileo
          cp -a sileo-repo/. website/dist/sileo/
          echo "Published unsigned Sileo repository to the Pages artifact at /sileo/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Validate deployed Sileo source and package URL
        shell: bash
        env:
          SITE_URL: https://bluexdeev25432.github.io/LiquidGlassX
        run: |
          set -euo pipefail
          curl -fsSIL "$SITE_URL/sileo/index.html" | grep -Eq 'HTTP/.* 200|HTTP/.* 301|HTTP/.* 302'
          curl -fsSIL "$SITE_URL/sileo/Release" | grep -Eq 'HTTP/.* 200|HTTP/.* 301|HTTP/.* 302'
          curl -fsSIL "$SITE_URL/sileo/Packages" | grep -Eq 'HTTP/.* 200|HTTP/.* 301|HTTP/.* 302'
          curl -fsSIL "$SITE_URL/sileo/Packages.gz" | grep -Eq 'HTTP/.* 200|HTTP/.* 301|HTTP/.* 302'
          curl -fsSL "$SITE_URL/sileo/Release" -o /tmp/sileo-Release
          grep -Fq 'Architectures: iphoneos-arm64' /tmp/sileo-Release
          curl -fsSL "$SITE_URL/sileo/Packages" -o /tmp/sileo-Packages
          curl -fsSL "$SITE_URL/sileo/Packages.gz" -o /tmp/sileo-Packages.gz
          gzip -dc /tmp/sileo-Packages.gz | cmp -s - /tmp/sileo-Packages
          grep -Fq 'Package: com.blue.liquidglassx' /tmp/sileo-Packages
          grep -Fq 'Version: 0.0.1-7+debug' /tmp/sileo-Packages
          grep -Fq 'Architecture: iphoneos-arm64' /tmp/sileo-Packages
          DEB_PATH=$(awk '$1=="Filename:" {print $2; exit}' /tmp/sileo-Packages)
          EXPECTED_SHA=$(awk '$1=="SHA256:" {print $2; exit}' /tmp/sileo-Packages)
          PACKAGES_SHA=$(sha256sum /tmp/sileo-Packages | awk '{print $1}')
          PACKAGES_SIZE=$(wc -c < /tmp/sileo-Packages | tr -d ' ')
          PACKAGES_GZ_SHA=$(sha256sum /tmp/sileo-Packages.gz | awk '{print $1}')
          PACKAGES_GZ_SIZE=$(wc -c < /tmp/sileo-Packages.gz | tr -d ' ')
          grep -Eq "^[[:space:]]+$PACKAGES_SHA[[:space:]]+$PACKAGES_SIZE[[:space:]]+Packages$" /tmp/sileo-Release
          grep -Eq "^[[:space:]]+$PACKAGES_GZ_SHA[[:space:]]+$PACKAGES_GZ_SIZE[[:space:]]+Packages.gz$" /tmp/sileo-Release
          test -n "$DEB_PATH"
          test -n "$EXPECTED_SHA"
          DEB_URL="$SITE_URL/sileo/$DEB_PATH"
          curl -fsSIL "$DEB_URL" | grep -Eq 'HTTP/.* 200|HTTP/.* 301|HTTP/.* 302'
          curl -fsSL "$DEB_URL" -o /tmp/sileo-package.deb
          printf '%s  %s\n' "$EXPECTED_SHA" /tmp/sileo-package.deb | sha256sum --check --status
          test "$(dpkg-deb -f /tmp/sileo-package.deb Package)" = com.blue.liquidglassx
          test "$(dpkg-deb -f /tmp/sileo-package.deb Version)" = 0.0.1-7+debug
          test "$(dpkg-deb -f /tmp/sileo-package.deb Architecture)" = iphoneos-arm64
          echo "Flat Sileo Release, Packages, and package artifact all match the verified published package."
